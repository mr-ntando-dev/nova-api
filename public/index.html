<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NovaSpark API v3.1</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{--bg:#0a0a0f;--surface:#12121a;--surface2:#1a1a26;--border:#252535;--text:#e8e8f0;--text-dim:#8888a0;--accent:#6c5ce7;--accent2:#a29bfe;--green:#00d68f;--red:#ff6b6b;--orange:#ffa502;--blue:#4ecdc4}
    body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
    .header{background:linear-gradient(135deg,#6c5ce7 0%,#a29bfe 50%,#4ecdc4 100%);padding:2rem;text-align:center}
    .header h1{font-size:2.5rem;font-weight:800;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,0.3)}
    .header p{color:rgba(255,255,255,0.85);margin-top:0.5rem;font-size:1.1rem}
    .stats{display:flex;gap:1rem;justify-content:center;margin-top:1.5rem;flex-wrap:wrap}
    .stat{background:rgba(255,255,255,0.15);backdrop-filter:blur(10px);padding:0.5rem 1.25rem;border-radius:50px;color:#fff;font-size:0.85rem;font-weight:500}
    .nav{background:var(--surface);border-bottom:1px solid var(--border);padding:0.75rem 1rem;display:flex;gap:0.5rem;overflow-x:auto;position:sticky;top:0;z-index:100}
    .nav-btn{padding:0.5rem 1rem;border:1px solid var(--border);background:transparent;color:var(--text-dim);border-radius:8px;cursor:pointer;font-size:0.8rem;font-weight:500;white-space:nowrap;transition:all 0.2s}
    .nav-btn:hover{border-color:var(--accent);color:var(--accent)}
    .nav-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
    .container{max-width:1100px;margin:0 auto;padding:2rem 1rem}
    .section{display:none}.section.active{display:block}
    .section-title{font-size:1.5rem;font-weight:700;margin-bottom:0.25rem;display:flex;align-items:center;gap:0.5rem}
    .section-desc{color:var(--text-dim);margin-bottom:1.5rem;font-size:0.9rem}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.25rem;margin-bottom:1rem;transition:border-color 0.2s}
    .card:hover{border-color:var(--accent)}
    .card-head{display:flex;align-items:center;gap:0.75rem;margin-bottom:0.75rem}
    .badge{padding:0.2rem 0.5rem;border-radius:4px;font-size:0.7rem;font-weight:700;font-family:'JetBrains Mono'}
    .badge.get{background:rgba(0,214,143,0.15);color:var(--green)}
    .badge.post{background:rgba(255,165,2,0.15);color:var(--orange)}
    .card-path{font-family:'JetBrains Mono';font-size:0.85rem;color:var(--text)}
    .card-desc{font-size:0.8rem;color:var(--text-dim);margin-bottom:0.75rem}
    .inputs{display:flex;gap:0.5rem;flex-wrap:wrap;margin-bottom:0.5rem}
    .inputs input,.inputs textarea,.inputs select{flex:1;min-width:150px;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:0.5rem 0.75rem;color:var(--text);font-size:0.8rem;font-family:'JetBrains Mono'}
    .inputs input:focus,.inputs textarea:focus{outline:none;border-color:var(--accent)}
    .btn{background:var(--accent);color:#fff;border:none;padding:0.5rem 1rem;border-radius:6px;font-weight:600;cursor:pointer;font-size:0.8rem}
    .btn:hover{opacity:0.85}
    .btn:disabled{opacity:0.4;cursor:not-allowed}
    .response{margin-top:0.75rem;background:var(--bg);border:1px solid var(--border);border-radius:8px;display:none;overflow:hidden}
    .response.show{display:block}
    .res-head{padding:0.4rem 0.75rem;background:var(--surface2);border-bottom:1px solid var(--border);font-size:0.75rem;font-family:'JetBrains Mono';display:flex;justify-content:space-between}
    .res-body{padding:0.75rem;max-height:300px;overflow-y:auto;font-family:'JetBrains Mono';font-size:0.75rem;white-space:pre-wrap;word-break:break-all;line-height:1.5}
    .status-ok{color:var(--green)}.status-err{color:var(--red)}
    @media(max-width:768px){.header h1{font-size:1.5rem}.container{padding:1rem 0.5rem}.inputs{flex-direction:column}}
  </style>
</head>
<body>
  <div class="header">
    <h1>⚡ NovaSpark API</h1>
    <p>All-in-One API for WhatsApp Bots — 82+ Endpoints, Zero Config</p>
    <div class="stats">
      <div class="stat">🚀 v3.1.0</div>
      <div class="stat">📡 82+ Endpoints</div>
      <div class="stat">🆓 Free & Open Source</div>
      <div class="stat" id="uptime">⏱ Loading...</div>
    </div>
  </div>

  <div class="nav" id="nav"></div>

  <div class="container" id="content"></div>

  <script>
const BASE = window.location.origin;
const SECTIONS = [
  { id:'novaai', icon:'fa-robot', label:'NovaAI', desc:'Advanced AI chat with personas, code generation, and more',

      {m:'POST',p:'/api/novaai/eli5',d:'Explain Like I\'m 5',inputs:[{n:'topic',ph:'quantum physics'}],body:true},
      {m:'GET',p:'/api/novaai/compliment',d:'AI Compliment',inputs:[{n:'name',ph:'John'}]},
      {m:'GET',p:'/api/novaai/pickup',d:'Pickup line',inputs:[{n:'topic',ph:'coding'}]},
      {m:'GET',p:'/api/novaai/wyr',d:'Would You Rather (AI)'},
    ]},
  { id:'downloader', icon:'fa-download', label:'Downloader', desc:'Download from YouTube, TikTok, Instagram & more',
    endpoints:[
      {m:'GET',p:'/api/downloader/youtube',d:'YouTube video info',inputs:[{n:'url',ph:'https://youtube.com/watch?v=...'}]},
      {m:'GET',p:'/api/downloader/youtube/audio',d:'YouTube audio',inputs:[{n:'url',ph:'https://youtube.com/watch?v=...'}]},
      {m:'GET',p:'/api/downloader/youtube/search',d:'YouTube search',inputs:[{n:'q',ph:'lofi hip hop'}]},
      {m:'GET',p:'/api/downloader/tiktok',d:'TikTok no watermark',inputs:[{n:'url',ph:'https://tiktok.com/@user/video/...'}]},
      {m:'GET',p:'/api/downloader/instagram',d:'Instagram media',inputs:[{n:'url',ph:'https://instagram.com/p/...'}]},
      {m:'GET',p:'/api/downloader/twitter',d:'Twitter/X video',inputs:[{n:'url',ph:'https://x.com/user/status/...'}]},
    ]},
  { id:'ai', icon:'fa-brain', label:'AI', desc:'Chat, translate, imagine, summarize, sentiment analysis',
    endpoints:[
      {m:'POST',p:'/api/ai/chat',d:'AI Chat',inputs:[{n:'message',ph:'Tell me a joke'}],body:true},
      {m:'GET',p:'/api/ai/imagine',d:'AI Image Gen',inputs:[{n:'prompt',ph:'a cat in space'}]},
      {m:'GET',p:'/api/ai/translate',d:'Translate text',inputs:[{n:'text',ph:'Hello world'},{n:'to',ph:'es'}]},
      {m:'POST',p:'/api/ai/summarize',d:'Summarize text',inputs:[{n:'text',ph:'Paste long text here...',type:'textarea'}],body:true},
      {m:'POST',p:'/api/ai/sentiment',d:'Sentiment analysis',inputs:[{n:'text',ph:'I love this product!'}],body:true},
      {m:'GET',p:'/api/ai/lyrics',d:'Song lyrics',inputs:[{n:'song',ph:'Bohemian Rhapsody'},{n:'artist',ph:'Queen'}]},
      {m:'GET',p:'/api/ai/define',d:'Word definition',inputs:[{n:'word',ph:'serendipity'}]},
    ]},
  { id:'tools', icon:'fa-wrench', label:'Tools', desc:'QR codes, weather, currency, hashing, encoding & more',
    endpoints:[
      {m:'GET',p:'/api/tools/qr',d:'QR Code generator',inputs:[{n:'text',ph:'https://example.com'}]},
      {m:'GET',p:'/api/tools/weather',d:'Weather info',inputs:[{n:'city',ph:'London'}]},
      {m:'GET',p:'/api/tools/currency',d:'Currency convert',inputs:[{n:'from',ph:'USD'},{n:'to',ph:'ZAR'},{n:'amount',ph:'100'}]},
      {m:'GET',p:'/api/tools/password',d:'Password generator',inputs:[{n:'length',ph:'16'}]},
      {m:'GET',p:'/api/tools/hash',d:'Hash text',inputs:[{n:'text',ph:'hello'},{n:'algo',ph:'sha256'}]},
      {m:'GET',p:'/api/tools/ip',d:'IP Lookup',inputs:[{n:'ip',ph:'8.8.8.8'}]},
      {m:'GET',p:'/api/tools/joke',d:'Random joke'},
      {m:'GET',p:'/api/tools/quote',d:'Random quote'},
      {m:'GET',p:'/api/tools/wiki',d:'Wikipedia search',inputs:[{n:'q',ph:'artificial intelligence'}]},
    ]},
  { id:'crypto', icon:'fa-coins', label:'Crypto', desc:'Real-time crypto prices, trending coins, market data',
    endpoints:[
      {m:'GET',p:'/api/crypto/price',d:'Coin price',inputs:[{n:'coin',ph:'bitcoin'},{n:'currency',ph:'usd'}]},
      {m:'GET',p:'/api/crypto/prices',d:'Multiple prices',inputs:[{n:'coins',ph:'bitcoin,ethereum,solana'}]},
      {m:'GET',p:'/api/crypto/trending',d:'Trending coins'},
      {m:'GET',p:'/api/crypto/info',d:'Coin details',inputs:[{n:'coin',ph:'ethereum'}]},
      {m:'GET',p:'/api/crypto/global',d:'Global market stats'},
    ]},
  { id:'entertainment', icon:'fa-gamepad', label:'Fun', desc:'Movies, books, horoscope, riddles, facts, games',
    endpoints:[
      {m:'GET',p:'/api/entertainment/movie',d:'Movie/TV search',inputs:[{n:'title',ph:'Inception'}]},
      {m:'GET',p:'/api/entertainment/book',d:'Book search',inputs:[{n:'q',ph:'Harry Potter'}]},
      {m:'GET',p:'/api/entertainment/horoscope',d:'Horoscope',inputs:[{n:'sign',ph:'aries'}]},
      {m:'GET',p:'/api/entertainment/riddle',d:'Random riddle'},
      {m:'GET',p:'/api/entertainment/fact',d:'Random fact'},
      {m:'GET',p:'/api/entertainment/today',d:'This day in history'},
      {m:'GET',p:'/api/entertainment/truthordare',d:'Truth or Dare',inputs:[{n:'type',ph:'truth/dare/random'}]},
    ]},
  { id:'dev', icon:'fa-code', label:'Dev Tools', desc:'GitHub, NPM, regex, JSON, UUID, timestamps',
    endpoints:[
      {m:'GET',p:'/api/dev/github',d:'GitHub user info',inputs:[{n:'username',ph:'torvalds'}]},
      {m:'GET',p:'/api/dev/github/repos',d:'GitHub repos',inputs:[{n:'username',ph:'torvalds'}]},
      {m:'GET',p:'/api/dev/npm',d:'NPM package info',inputs:[{n:'package',ph:'express'}]},
      {m:'GET',p:'/api/dev/httpstatus',d:'HTTP status info',inputs:[{n:'code',ph:'404'}]},
      {m:'POST',p:'/api/dev/regex',d:'Regex tester',inputs:[{n:'pattern',ph:'\\d+'},{n:'text',ph:'hello 123 world 456'}],body:true},
      {m:'POST',p:'/api/dev/json',d:'JSON validator',inputs:[{n:'text',ph:'{"key": "value"}',type:'textarea'}],body:true},
      {m:'GET',p:'/api/dev/uuid',d:'UUID generator',inputs:[{n:'count',ph:'5'}]},
      {m:'GET',p:'/api/dev/timestamp',d:'Timestamp converter',inputs:[{n:'ts',ph:'1700000000'}]},
    ]},
  { id:'search', icon:'fa-search', label:'Search', desc:'Web, news, images, GIFs, Urban Dictionary',
    endpoints:[
      {m:'GET',p:'/api/search/google',d:'Web search',inputs:[{n:'q',ph:'latest tech news'}]},
      {m:'GET',p:'/api/search/news',d:'News search',inputs:[{n:'q',ph:'AI'}]},
      {m:'GET',p:'/api/search/images',d:'Image search',inputs:[{n:'q',ph:'sunset'}]},
      {m:'GET',p:'/api/search/gif',d:'GIF search',inputs:[{n:'q',ph:'happy'}]},
      {m:'GET',p:'/api/search/urban',d:'Urban Dictionary',inputs:[{n:'term',ph:'GOAT'}]},
    ]},
  { id:'media', icon:'fa-photo-film', label:'Media', desc:'Memes, anime, pokemon, random animals',
    endpoints:[
      {m:'GET',p:'/api/media/meme',d:'Random meme',inputs:[{n:'subreddit',ph:'memes'}]},
      {m:'GET',p:'/api/media/waifu',d:'Anime image',inputs:[{n:'type',ph:'waifu/neko/hug'}]},
      {m:'GET',p:'/api/media/cat',d:'Random cat'},
      {m:'GET',p:'/api/media/dog',d:'Random dog'},
      {m:'GET',p:'/api/media/pokemon',d:'Pokémon info',inputs:[{n:'name',ph:'pikachu'}]},
      {m:'GET',p:'/api/media/anime',d:'Anime search',inputs:[{n:'q',ph:'Naruto'}]},
    ]},
  { id:'whatsapp', icon:'fa-comment-dots', label:'WhatsApp', desc:'Stickers, welcome cards, rank cards, text images',
    endpoints:[
      {m:'POST',p:'/api/whatsapp/sticker',d:'Image to sticker',inputs:[{n:'imageUrl',ph:'https://example.com/img.png'}],body:true},
      {m:'GET',p:'/api/whatsapp/welcome',d:'Welcome card',inputs:[{n:'name',ph:'John'},{n:'group',ph:'Cool Group'}]},
      {m:'GET',p:'/api/whatsapp/goodbye',d:'Goodbye card',inputs:[{n:'name',ph:'John'},{n:'group',ph:'Cool Group'}]},
      {m:'GET',p:'/api/whatsapp/rankcard',d:'Rank card',inputs:[{n:'name',ph:'Player1'},{n:'level',ph:'5'},{n:'xp',ph:'750'},{n:'maxXp',ph:'1000'}]},
    ]},
  { id:'shazam', icon:'fa-music', label:'Shazam', desc:'Song identification, search, lyrics, artist info & trending charts',
    endpoints:[
      {m:'GET',p:'/api/shazam/identify',d:'Identify song from audio URL',inputs:[{n:'url',ph:'https://example.com/audio.mp3'}]},
      {m:'GET',p:'/api/shazam/youtube',d:'Identify song from YouTube URL',inputs:[{n:'url',ph:'https://youtube.com/watch?v=...'}]},
      {m:'GET',p:'/api/shazam/search',d:'Search song by title/artist',inputs:[{n:'q',ph:'Blinding Lights'},{n:'limit',ph:'5'}]},
      {m:'GET',p:'/api/shazam/details',d:'Song details by MusicBrainz ID',inputs:[{n:'mbid',ph:'recording-uuid-here'}]},
      {m:'GET',p:'/api/shazam/artist',d:'Artist info',inputs:[{n:'name',ph:'The Weeknd'}]},
      {m:'GET',p:'/api/shazam/trending',d:'Trending / chart songs',inputs:[{n:'limit',ph:'10'},{n:'country',ph:'US (optional)'}]},
      {m:'GET',p:'/api/shazam/lyrics',d:'Get lyrics',inputs:[{n:'title',ph:'Blinding Lights'},{n:'artist',ph:'The Weeknd'}]},
    ]},
];

// Build nav
const nav = document.getElementById('nav');
SECTIONS.forEach((s,i) => {
  const btn = document.createElement('button');
  btn.className = 'nav-btn' + (i===0?' active':'');
  btn.innerHTML = `<i class="fas ${s.icon}"></i> ${s.label}`;
  btn.onclick = () => switchSection(s.id);
  nav.appendChild(btn);
});

// Build content
const content = document.getElementById('content');
SECTIONS.forEach((s,i) => {
  let html = `<div class="section${i===0?' active':''}" id="sec-${s.id}">
    <div class="section-title"><i class="fas ${s.icon}"></i> ${s.label}</div>
    <div class="section-desc">${s.desc}</div>`;
  s.endpoints.forEach((ep,j) => {
    const id = `${s.id}-${j}`;
    html += `<div class="card">
      <div class="card-head">
        <span class="badge ${ep.m.toLowerCase()}">${ep.m}</span>
        <span class="card-path">${ep.p}</span>
      </div>
      <div class="card-desc">${ep.d}</div>`;
    if(ep.inputs?.length){
      html += `<div class="inputs">`;
      ep.inputs.forEach(inp => {
        if(inp.type==='textarea') html += `<textarea id="in-${id}-${inp.n}" placeholder="${inp.ph}" rows="2"></textarea>`;
        else html += `<input id="in-${id}-${inp.n}" placeholder="${inp.ph}">`;
      });
      html += `</div>`;
    }
    html += `<button class="btn" onclick="test('${id}',${j},'${s.id}')">Test →</button>
      <div class="response" id="res-${id}">
        <div class="res-head"><span id="stat-${id}"></span><span id="time-${id}"></span></div>
        <div class="res-body" id="body-${id}"></div>
      </div>
    </div>`;
  });
  html += `</div>`;
  content.innerHTML += html;
});

function switchSection(id){
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('sec-'+id).classList.add('active');
  const idx = SECTIONS.findIndex(s=>s.id===id);
  nav.children[idx].classList.add('active');
}

async function test(id, epIdx, secId){
  const sec = SECTIONS.find(s=>s.id===secId);
  const ep = sec.endpoints[epIdx];
  const resEl = document.getElementById('res-'+id);
  const bodyEl = document.getElementById('body-'+id);
  const statEl = document.getElementById('stat-'+id);
  const timeEl = document.getElementById('time-'+id);

  resEl.classList.add('show');
  bodyEl.textContent = 'Loading...';
  statEl.textContent = '...';
  statEl.className = '';

  const start = Date.now();
  try {
    let url = BASE + ep.p;
    let opts = {};
    if(ep.m === 'GET'){
      if(ep.inputs){
        const params = new URLSearchParams();
        ep.inputs.forEach(inp => {
          const v = document.getElementById('in-'+id+'-'+inp.n)?.value;
          if(v) params.set(inp.n, v);
        });
        const qs = params.toString();
        if(qs) url += '?' + qs;
      }
    } else {
      opts.method = 'POST';
      opts.headers = {'Content-Type':'application/json'};
      const body = {};
      ep.inputs?.forEach(inp => {
        const v = document.getElementById('in-'+id+'-'+inp.n)?.value;
        if(v) body[inp.n] = v;
      });
      opts.body = JSON.stringify(body);
    }
    const r = await fetch(url, opts);
    const ms = Date.now() - start;
    const data = await r.json();
    statEl.textContent = r.status + ' ' + (r.ok?'OK':'Error');
    statEl.className = r.ok ? 'status-ok' : 'status-err';
    timeEl.textContent = ms + 'ms';
    bodyEl.textContent = JSON.stringify(data, null, 2);
  } catch(e){
    statEl.textContent = 'Error';
    statEl.className = 'status-err';
    timeEl.textContent = (Date.now()-start)+'ms';
    bodyEl.textContent = e.message;
  }
}

// Uptime
fetch(BASE+'/health').then(r=>r.json()).then(d=>{
  document.getElementById('uptime').textContent='⏱ Up '+Math.floor(d.uptime/60)+'m';
}).catch(()=>{});
  </script>
</body>
</html>
